[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x3d-mcp"
version = "0.1.0"
description = "MCP server for generating, validating, and converting valid X3D content"
requires-python = ">=3.12"
dependencies = [
    # mcp 2.x renamed FastMCP to MCPServer; src/ imports mcp.server.fastmcp.
    # 1.29 is the first release with a fixed request-body cap on /mcp (4 MiB), which the
    # blob tools' size limits are written against; large documents go through /blob.
    "mcp>=1.29,<2",
    "x3d>=4.0.65.5,<5",
    "lxml>=6.0",
    "xmlschema>=4.3",
    "jsonschema>=4.26",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "brotli>=1.2.0",     # the transfer-layer tests exercise every upload codec (see [blob])
    "zstandard>=0.23",
    "numpy>=1.26",       # the splat tests (see [splat])
]
# Brotli and zstd uploads/downloads for the blob store (docs/transfer-layer.md). Without them
# the store still works: br and zstd answer 415 and blobs are kept with the standard library.
blob = [
    "brotli>=1.2.0",     # older wheels cannot bound their output, so br is refused below this
    "zstandard>=0.23",
]
# Gaussian splat tools (splat_inspect, splat_chunk; docs/splats.md): numpy decodes SPZ and PLY, and
# zstandard reads SPZ version 4. Without numpy the tools are not registered and validate_xml still
# answers an oversize scene with a plain verdict (it only skips the value checks).
splat = [
    "numpy>=1.26",
    "zstandard>=0.23",
]
# render_image renders scenes to PNG via headless Chromium. Heavy, so optional:
#   pip install 'x3d-mcp[render]' && python -m playwright install chromium
render = [
    "playwright>=1.40",
    "pillow>=10",  # blank/near-empty frame detection; optional at runtime
]

# The Accountability Playground web service (playground/): Google sign-in and
# Vertex AI credentials. Firestore is only for running more than one instance.
playground = [
    "google-auth>=2.30",
    "requests>=2.31",
]
playground-firestore = [
    "google-cloud-firestore>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
