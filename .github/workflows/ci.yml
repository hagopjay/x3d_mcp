name: CI

# Runs the same pytest suite that `docker compose up --build` runs, on the
# Python versions the package supports (pyproject.toml: requires-python >= 3.12).
# No secrets and no network access beyond pip. Tests that need Playwright/Chromium
# or Pillow skip themselves via pytest.importorskip because the optional `render`
# extra is deliberately not installed here. Nothing in the suite calls an LLM.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Same as Dockerfile.test
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (mcp is pinned <2 by pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Show resolved versions
        run: python -m pip list

      - name: Run tests
        run: python -m pytest tests/ -v -rs
